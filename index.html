<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>
    <style>
        /* Estilização Geral e Centralização */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h2 {
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Formulário */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            border-color: #5cb85c;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #4cae4c;
        }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
            color: #333;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        /* Botão de Excluir na Tabela */
        .btn-delete {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

    <!-- Container do Formulário -->
    <div class="container">
        <h2>Cadastro de Usuário</h2>
        <form id="meuFormulario">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required placeholder="Digite o nome completo">
            </div>
            <div class="form-group">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" required placeholder="Digite a idade">
            </div>
            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <!-- Container da Tabela -->
    <div class="container">
        <h2>Lista de Cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <!-- As linhas com os dados dos usuários entrarão aqui via JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        // Seleciona os elementos da página
        const formulario = document.getElementById('meuFormulario');
        const corpoTabela = document.getElementById('corpoTabela');

        // Escuta o evento de envio do formulário
        formulario.addEventListener('submit', function(event) {
            // Evita que a página recarregue ao enviar o formulário
            event.preventDefault();

            // Captura os valores digitados nos campos
            const nome = document.getElementById('nome').value;
            const idade = document.getElementById('idade').value;

            // Cria uma nova linha (tr) na tabela
            const novaLinha = document.createElement('tr');

            // Insere as células de dados (td) dentro da linha criada
            novaLinha.innerHTML = `
                <td>${nome}</td>
                <td>${idade}</td>
                <td>
                    <button class="btn-delete" onclick="removerLinha(this)">Excluir</button>
                </td>
            `;

            // Adiciona a nova linha ao corpo da tabela
            corpoTabela.appendChild(novaLinha);

            // Limpa os campos do formulário para o próximo cadastro
            formulario.reset();
        });

        // Função para o botão Excluir funcionar
        function removerLinha(botao) {
            // Remove a linha (tr) que é mãe do botão clicado
            botao.closest('tr').remove();
        }
    </script>

</body>
</html>
